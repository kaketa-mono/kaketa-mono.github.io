    <h1>2月11日　金曜日　晴れ</h1>

    <p>
      小学校の頃は、勉強もそれなりに頑張っていた。<br>
      得意な教科と苦手な教科はあったけど、特に嫌いではなかった。
    </p>

    <p>
      テストでいい点を取ると、先生が褒めてくれた。<br>
      家に帰って見せると、母も喜んでくれた。
    </p>

    <p>
      もっと頑張れば、もっと褒めてもらえる。<br>
      子供の頃は、そんな単純な考え方をしていた気がする。
    </p>

    <p>
      今は、あの頃みたいに何かを頑張ることができなくなった。
    </p>

    <p>
      いつから変わったんだろう。
    </p>

    <p>
      明日は、もう少し先のことを思い出してみよう。
    </p>

  </div>
