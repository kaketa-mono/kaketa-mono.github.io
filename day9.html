<body>

  <div class="diary">

    <h1>2月9日　水曜日　晴れ</h1>

    <p>
      小学校では、何人か仲のいい子がいた。<br>
      休み時間になると一緒に遊んで、帰る時間になると一緒に帰った。
    </p>

    <p>
      放課後にそのまま誰かの家へ遊びに行くこともあった。<br>
      ゲームをしたり、漫画を読んだり、外で遊んだり。<br>
      今思えば、特別なことは何もしていなかった。
    </p>

    <p>
      でも、そういう何でもない時間が一番楽しかった気がする。
    </p>

    <p>
      その中でも、特に一緒にいることが多かったやつがいた。<br>
      今でも名前を覚えている。
    </p>

    <p>
      あいつとは、くだらないことで笑ってばかりいた。
    </p>

    <p>
      明日は、その頃に好きだった遊びのことを書いてみよう。
    </p>

  </div>

</body>
