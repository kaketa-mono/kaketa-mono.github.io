    <h1>2月16日　水曜日　曇り</h1>

    <p>
      中学校の生活にも慣れてきた頃、少しだけ変なことがあった。<br>
      朝、学校へ行くのが面倒だと思う日が増えてきた。<br>
    </p>

    <p>
      それまでは、眠くても起きれば普通に準備をしていた。<br>
      なのに、布団の中であと五分だけと思うことが多くなった。<br>
    </p>

    <p>
      別に学校が嫌だったわけじゃない。<br>
      友達もいたし、部活もあった。<br>
    </p>

    <p>
      それなのに、玄関で靴を履くまでが妙に長かった。<br>
    </p>

    <p>
      当時は、ただの<span class="hidden-word">寝不足</span>だと思っていた。<br>
    </p>

    <p>
      明日は、もう少しその頃のことを思い出してみよう。
    </p>
