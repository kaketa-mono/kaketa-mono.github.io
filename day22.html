    <h1>2月22日　火曜日　雨</h1>

    <p>
      昨日は休んだけど、今日は学校へ行った。<br>
      教室に入ると、特に何も変わっていなかった。<br>
    </p>

    <p>
      友達にも普通に話しかけられた。<br>
      先生も特に何も言わなかった。<br>
    </p>

    <p>
      それなのに、昨日休んだことが妙に気になった。<br>
      自分だけ何か違うことをしてしまったような気がした。<br>
    </p>

    <p>
      授業中も、時計を見ることが増えた。<br>
      早く終わらないかなと思っているうちに、時間だけが過ぎていった。<br>
    </p>

    <p>
      帰る頃には少し疲れていた。<br>
      家に着くと、何もする気になれず、そのまま部屋にいた。<br>
    </p>

    <p>
      母には「普通だった」と答えた。<br>
      それ以上は何も聞かれなかった。
    </p>
