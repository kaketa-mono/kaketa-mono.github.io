<!DOCTYPE html>

  <title>2月5日</title>

  <style>
    body {
      background-color: #f5f1e8;
      margin: 0;
      padding: 30px;
      color: #222;
      font-family: serif;
      line-height: 2;

    h1 {
      font-size: 60px;
      margin-bottom: 40px;
    }

    .diary {
      max-width: 700px;
      margin: auto;
      font-size: 30px;
      font-weight: bold;
    }

      color: #f5f1e8;
    }
  </style>

<body>

  <div class="diary">

    <h1>2月5日　土曜日　曇り</h1>

    <p>
      幼稚園から帰ると、いつも姉がいた。<br>
      姉は俺より少し年上で、何をするにも俺より先だった。
    </p>

    <p>
      一緒に遊んでくれることもあったけど、喧嘩することも多かった。<br>
      くだらないことで言い合いになって、母に怒られて。<br>
      しばらくすると、何事もなかったみたいにまた一緒に遊んでいた。
    </p>

    <p>
      当時は、それが当たり前だと思っていた。
    </p>

    <p>
      今になって考えると、あんなふうに何も気にせず<br>
      一緒にいられたのは、
      <span class="hidden-word">家族</span>だったからなのかもしれない。
    </p>

    <p>
      ……そう考えると、少しだけ懐かしい。
    </p>

    <p>
      明日は、小学校に入った頃のことを書いてみようと思う。
    </p>

  </div>

</body>
