    <h1>2月21日　月曜日　曇り</h1>

    <p>
      朝になると、学校へ行く準備をするのがだんだん遅くなった。<br>
      起きてから着替えるまでに時間がかかる。<br>
    </p>

    <p>
      ある日、気づいたら家を出る時間を過ぎていた。<br>
      急いで準備すれば間に合ったかもしれないけど、もういいかと思った。<br>
    </p>

    <p>
      母には「今日は休む」とだけ言った。<br>
      体調が悪いわけではなかったから、少し変な顔をされた。<br>
    </p>

    <p>
      その日は一日家にいた。<br>
      昼頃になると、休んだことへの罪悪感が少し出てきた。<br>
    </p>

    <p>
      明日はちゃんと行こうと思った。<br>
      だから、その日のことはあまり考えないことにした。
    </p>
