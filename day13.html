    <h1>2月13日　日曜日　晴れ</h1>

    <p>
      小学校を卒業するときは、あまり寂しくなかった。<br>
      中学校に行けば、またみんなに会えると思っていたからだ。
    </p>

    <p>
      卒業式の日は、いつもより少しだけ静かだった。<br>
      教室の黒板には、先生が何かを書いてくれていた。
    </p>

    <p>
      最後にみんなで写真を撮った。<br>
      笑っている人もいれば、泣いている人もいた。
    </p>

    <p>
      俺は笑っていたと思う。
    </p>

    <p>
      あの日から、少しずつ周りの環境が変わっていった。
    </p>

    <p>
      次は、中学校に入った頃のことを書いてみようと思う。
    </p>
