    <h1>2月19日　土曜日　晴れ</h1>

    <p>
      部活がない日は、学校が終わるとすぐ家に帰った。<br>
      以前なら誰かと遊んでいたけど、そういうことも減った。<br>
    </p>

    <p>
      家に帰っても、特にやることはない。<br>
      宿題をして、ゲームをして、夕飯を食べる。<br>
    </p>

    <p>
      それだけで一日が終わった。<br>
    </p>

    <p>
      母から「今日は学校どうだった？」と聞かれても、<br>
      「普通」と答えることが多くなった。<br>
    </p>

    <p>
      本当に普通だったのかは、今となってはよく分からない。<br>
    </p>

    <p>
      ただ、一人でいる時間が前より<span class="hidden-word">長く</span>なった。<br>
    </p>

    <p>
      明日は、もう少し学校のことを思い出してみよう。
    </p>
