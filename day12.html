    <h1>2月12日　土曜日　曇り</h1>

    <p>
      小学校では、好きな先生がいた。<br>
      怖い先生もいたけど、その先生はいつも優しかった。
    </p>

    <p>
      授業で分からないところがあると、何度でも教えてくれた。<br>
      くだらない話をしても笑ってくれた。
    </p>

    <p>
      卒業するとき、みんなで手紙を書いた。<br>
      俺も何を書けばいいのか悩みながら、一生懸命書いた。
    </p>

    <p>
      あの頃は、先生というものがずっと近くにいるものだと思っていた。
    </p>

    <p>
      今思えば、あの<span class="hidden-word">先生</span>にはかなり助けてもらっていたのかもしれない。
    </p>

    <p>
      明日は、卒業する頃のことを思い出してみよう。
    </p>
