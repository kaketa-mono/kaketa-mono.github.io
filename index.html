<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>欠けた暦</title>

  <style>
    body {
      background-color: #f5f1e8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 80px;
      text-align: center;
      margin-bottom: 50px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      max-width: 700px;
      margin: auto;
    }

    .calendar a {
      border: 1px solid black;
      padding: 20px;
      text-align: center;
      color: black;
      text-decoration: none;
      font-size: 33px;
    }

    .empty {
      border: 1px solid black;
      padding: 20px;
    }

    .hidden-day {
      border: 1px solid black;
      padding: 20px;
      color: transparent;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>欠けた暦</h1>

  <div class="calendar">

    <!-- 1週間目：日・月は空白、火曜日から1日 -->
    <div class="empty"></div>
    <div class="empty"></div>

    <a href="/20280201">1</a>
    <a href="/20280202">2</a>
    <a href="/20280203">3</a>
    <a href="/20280204">4</a>
    <a href="/20280205">5</a>

    <!-- 2週間目 -->
    <a href="/20280206">6</a>
    <a href="/20280207">7</a>
    <a href="/20280208">8</a>
    <a href="/20280209">9</a>
    <a href="/20280210">10</a>
    <a href="/20280211">11</a>
    <a href="/20280212">12</a>

    <!-- 3週間目 -->
    <a href="/20280213">13</a>
    <a href="/20280214">14</a>
    <a href="/20280215">15</a>
    <a href="/20280216">16</a>
    <a href="/20280217">17</a>
    <a href="/20280218">18</a>
    <a href="/20280219">19</a>

    <!-- 4週間目 -->
    <a href="/20280220">20</a>
    <a href="/20280221">21</a>
    <a href="/20280222">22</a>
    <a href="/20280223">23</a>
    <a href="/20280224">24</a>
    <a href="/20280225">25</a>
    <a href="/20280226">26</a>

    <!-- 5週間目 -->
    <a href="/20280227">27</a>
    <a href="/20280228">28</a>

    <!-- 29日目：数字は見えないがマスは存在する -->
    <a href="/20280229" class="hidden-day"></a>

    <!-- 残りの空白 -->
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="empty"></div>

  </div>

</body>
</html>
