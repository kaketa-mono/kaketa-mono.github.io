  <div class="diary">

    <h1>2月8日　火曜日　晴れ</h1>

    <p>
      小学校の頃、学校で一番楽しみだったのは給食だった。<br>
      午前中の授業が終わると、みんなで机を動かして準備をする。
    </p>

    <p>
      好きなものが出る日は、朝から楽しみだった。<br>
      逆に、苦手なものが出る日は少し憂鬱だった。
    </p>

    <p>
      それでも、みんなで同じものを食べるのが楽しかった。<br>
      誰が一番早く食べ終わるか競争したり、<br>
      苦手なものを友達に食べてもらったりもした。
    </p>

    <p>
      今では、あんなふうにみんなで同じ時間にご飯を食べることもほとんどない。
    </p>

    <p>
      ……そう考えると、少し懐かしい。
    </p>

    <p>
      明日は、学校でできた友達のことを思い出してみようと思う。
    </p>

  </div>
