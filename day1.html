<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2月1日</title>

  <style>
    body {
      background-color: #f5f1e8;
      margin: 0;
      padding: 30px;
      color: #222;
      font-family: serif;
      line-height: 2;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 40px;
    }

    .diary {
      max-width: 700px;
      margin: auto;
      font-size: 30px;
　　　　font-weight: bold;
    }

    .hidden-word {
      color: #f5f1e8;
    }
  </style>
</head>

<body>

  <div class="diary">

    <h1>2月1日　火曜日　晴れ</h1>

    <p>
      今日から2月の間だけ日記というものを<br>
      書いてみようと思う。<br>
      人生を振り返るにはちょうどいい。
    </p>

    <p>
      学校には、もうしばらく行けてない。<br>
      朝になっても起き上がる気になれなくて、<br>
      気がつけば一日が終わっている。
    </p>

    <p>
      今考えると、俺は2月と相性がいい気がする。<br>
      2月は一年の中で一番短い月だ。<br>
      何かが始まる月でもなければ、終わる月でもない。<br>
      ただ、次の月が来るのを待っている。
    </p>

    <p>
      ……俺も、今はそんな感じなのかもしれない。
    </p>

    <p>
      次は<span class="hidden-word">生まれた日</span>のことを思い出してみる。
    </p>

  </div>

</body>
</html>
