<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2月4日</title>

  <style>
    body {
      background-color: #f5f1e8;
      margin: 0;
      padding: 30px;
      color: #222;
      font-family: serif;
      line-height: 2;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 40px;
    }

    .diary {
      max-width: 700px;
      margin: auto;
      font-size: 30px;
      font-weight: bold;
    }

    .hidden-word {
      color: #f5f1e8;
    }
  </style>
</head>

<body>

  <div class="diary">

    <h1>2月4日　金曜日　晴れ</h1>

    <p>
      幼稚園の頃のことは、少しだけ覚えている。<br>
      毎朝、母に連れられて幼稚園へ行っていた。<br>
      最初の頃は、知らない人ばかりで少し怖かった気がする。
    </p>

    <p>
      でも、いつの間にか一緒に遊ぶようになった子がいた。<br>
      名前はもう思い出せない。<br>
      どんな顔だったかも、ぼんやりしている。
    </p>

    <p>
      それでも、隣にいると楽しかったことだけは覚えている。<br>
      子供の頃は、友達になるのに理由なんていらなかった。<br>
      同じ場所にいて、同じことで笑って、それだけで<span class="hidden-word">友達</span>だった。
    </p>

    <p>
      今は、どうしてあんなふうに簡単に仲良くなれないんだろう。
    </p>

    <p>
      明日は、家に帰ってからのことを書いてみようと思う。
    </p>

  </div>

</body>
</html>
