  <div class="diary">

    <h1>2月15日　火曜日　晴れ</h1>

    <p>
      中学校では、部活にも入った。<br>
      何をやるかかなり迷ったけど、友達が入ると言った部活に一緒に入った。
    </p>

    <p>
      最初は何をすればいいのか分からなかった。<br>
      先輩に教えてもらいながら、少しずつ覚えていった。
    </p>

    <p>
      練習は大変だったけど、終わった後にみんなで話す時間が好きだった。
    </p>

    <p>
      今思えば、学校に行く理由は勉強だけじゃなかったんだと思う。
    </p>

    <p>
      放課後に誰かと話すために学校へ行っていた日もあった。
    </p>

    <p>
      ……いつから、それがなくなったんだろう。
    </p>

    <p>
      明日は、もう少し中学校での人間関係について思い出してみよう。
    </p>

  </div>
