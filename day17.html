    <h1>2月17日　木曜日　雨</h1>

    <p>
      中学生になってから、周りの人のことを気にするようになった。<br>
      小学校の頃は、誰が何をしていてもあまり気にならなかった。<br>
    </p>

    <p>
      でも、中学校ではそうもいかなかった。<br>
      休み時間に誰と話すかとか、どこで昼ご飯を食べるかとか。<br>
    </p>

    <p>
      別に誰かに何か言われたわけじゃない。<br>
      ただ、自分だけ少し違うような気がすることがあった。<br>
    </p>

    <p>
      そんなことを考えているうちに、気づけば休み時間が終わっている。<br>
    </p>

    <p>
      今思えば、あの頃から少しずつ<span class="hidden-word">周り</span>を見るようになったのかもしれない。<br>
    </p>

    <p>
      明日は、友達のことを書いてみようと思う。
    </p>
