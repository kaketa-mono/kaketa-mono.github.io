<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2月6日</title>

  <style>
    body {
      background-color: #f5f1e8;
      margin: 0;
      padding: 30px;
      color: #222;
      font-family: serif;
      line-height: 2;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 40px;
    }

    .diary {
      max-width: 700px;
      margin: auto;
      font-size: 30px;
      font-weight: bold;
    }

    .hidden-word {
      color: #f5f1e8;
    }
  </style>
</head>

<body>

  <div class="diary">

    <h1>2月6日　日曜日　晴れ</h1>

    <p>
      小学校に入った頃のことを思い出してみる。<br>
      幼稚園よりもずっと人が多くて、最初は少し緊張していた気がする。
    </p>

    <p>
      教室には知らない顔がたくさんあった。<br>
      先生の話を聞いて、名前を書いて、決められた席に座って。<br>
      今までとは違う毎日が始まった。
    </p>

    <p>
      入学式の日は、母が学校まで一緒に来てくれた。<br>
      校門の前で写真を撮ったことも覚えている。
    </p>

    <p>
      あの頃は、これから何年もここに通うことになるなんて、<br>
      そんなことは何も考えていなかった。
    </p>

    <p>
      ただ、新しい生活が始まることが少し楽しみだった。
    </p>

    <p>
      明日は、最初の頃の<span class="hidden-word">小学校</span>での生活をもう少し思い出してみよう。
    </p>

  </div>

</body>
</html>
