    <h1>2月18日　金曜日　曇り</h1>

    <p>
      友達とは、少しずつ話すことが減っていった。<br>
      喧嘩をしたわけでもない。<br>
    </p>

    <p>
      いつの間にか、部活が終わったらそれぞれ帰るようになった。<br>
      前なら帰り道でくだらない話をしていたのに、最近はあまり話さない。<br>
    </p>

    <p>
      俺が何かしたのかと思って考えてみたけど、よく分からなかった。<br>
    </p>

    <p>
      それでも、次の日になれば普通に話せる。<br>
      だから、特に気にしないことにした。<br>
    </p>

    <p>
      たぶん、そういうものなんだと思う。<br>
    </p>

    <p>
      ただ、帰り道が少し<span class="hidden-word">静か</span>になった。<br>
    </p>

    <p>
      明日は、家に帰ってからのことを書こうと思う。
    </p>
