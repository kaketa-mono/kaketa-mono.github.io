    <h1>2月14日　月曜日　曇り</h1>

    <p>
      中学校に入ると、今までとは少し違う生活になった。<br>
      教科ごとに先生が変わって、授業も難しくなった。
    </p>

    <p>
      制服を着るようになったのも、この頃だった。<br>
      最初は少し大人になったような気がして嬉しかった。
    </p>

    <p>
      小学校から一緒だった友達もいたけど、<br>
      新しく話すようになった人もいた。
    </p>

    <p>
      何もかもが新しくて、毎日が忙しかった。
    </p>

    <p>
      それでも、学校へ行くことは当たり前だった。
    </p>

    <p>
      今の自分からすると、少し不思議な感じがする。
    </p>

    <p>
      明日は、中学校で始めた部活のことを書いてみよう。
    </p>

  </div>
