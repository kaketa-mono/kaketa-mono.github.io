  <style>
    body {
      background-color: #f5f1e8;

      line-height: 2;

      font-size: 60px;

    .diary {
      max-width: 700px;
      margin: auto;

<body>

  <div class="diary">

    <h1>2月10日　木曜日　曇り</h1>

    <p>
      小学生の頃は、放課後になるとよく外で遊んでいた。<br>
      家に帰ってからも、宿題より先に遊びに行っていた気がする。
    </p>

    <p>
      公園に集まって、ボールを蹴ったり、鬼ごっこをしたり。<br>
      その日の気分で遊ぶものを決めていた。
    </p>

    <p>
      時間なんて気にしていなかった。<br>
      暗くなって、親に呼ばれて、ようやく帰る。
    </p>

    <p>
      今なら、そんなに遅くまで遊んでいたら怒られそうだ。
    </p>

    <p>
      でも、あの頃は一日が終わるのが嫌だった。<br>
      もっと遊んでいたかった。
    </p>

    <p>
      明日は、少し時間を進めて、もう少し大きくなった頃のことを書いてみようと思う。
    </p>

  </div>

</body>
